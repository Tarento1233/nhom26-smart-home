<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập · Nhà thông minh</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fafbf6;color:#243c37;font:16px/1.6 "Segoe UI",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:430px;background:#fff;border:1px solid #e3e7df;border-radius:22px;padding:34px}header{color:#28634e;font-weight:700;margin-bottom:28px}h1{font-size:29px;line-height:1.25;margin:0 0 12px}p{color:#65756e;margin:0 0 24px}label{display:block;font-weight:600;font-size:14px;margin:18px 0 6px}input{font:inherit;border:1px solid #c9d6cd;border-radius:10px;padding:12px;width:100%;background:#fcfdfb}button{font:inherit;font-weight:650;background:#28634e;color:white;border:0;border-radius:11px;width:100%;min-height:49px;margin-top:24px;cursor:pointer}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #8cbfaf;outline-offset:3px}small{display:block;color:#748176;margin-top:22px}#error{color:#a23b25;margin:16px 0 0;min-height:26px;font-size:14px}</style></head>
<body><main><header>⌂ NHÀ THÔNG MINH · NHÓM 26</header><h1>Chào mừng về nhà</h1><p>Đăng nhập để xem căn phòng và điều khiển thiết bị.</p><form id="login"><label for="username">Tên đăng nhập</label><input id="username" name="username" autocomplete="username" required maxlength="80" autofocus><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><button id="submit" type="submit">Vào căn phòng</button><p id="error" role="alert"></p></form><small>Dùng tài khoản được tạo khi cài đặt. Mỗi máy có tài khoản riêng.</small></main>
<script>document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),error=document.getElementById('error');button.disabled=true;error.textContent='';try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Chưa đăng nhập được');location.assign(data.redirect);}catch(e){error.textContent=e.message;}finally{button.disabled=false;}});</script></body></html>
